name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-studio-ronecrew
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, hub]
    environment: production
    steps:
      - uses: actions/checkout@v4

      # O Hub publica a partir da pasta do projeto no Criador de apps.
      - name: Sincronizar código com o Hub
        run: |
          rsync -a --delete --exclude '.git' --exclude 'node_modules' --exclude 'dist' \
            ./ /mnt/c/Hub/VPS-main/data/app-builder/projetos/studio-ronecrew/

      - name: Publicar no Hub
        env:
          HUB_DEPLOY_TOKEN: ${{ secrets.HUB_DEPLOY_TOKEN }}
        run: |
          # 409 = outro deploy ainda em andamento: espera e tenta de novo.
          for i in $(seq 1 30); do
            code=$(curl -sS -o /tmp/hub-deploy.json -w '%{http_code}' -X POST -H "x-deploy-token: $HUB_DEPLOY_TOKEN"               http://127.0.0.1:3001/api/aplicacoes/deploy-hook/studio-ronecrew)
            cat /tmp/hub-deploy.json; echo
            [ "$code" = 200 ] && exit 0
            [ "$code" = 409 ] || exit 1
            sleep 20
          done
          exit 1
